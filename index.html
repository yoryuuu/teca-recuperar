<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Teca Saludable</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('fondo.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #f16523; 
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.22);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-top: 1.5px solid rgba(255, 255, 255, 0.65);
            border-left: 1.5px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15),
                        0 1px 3px rgba(255, 255, 255, 0.3) inset;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            margin-top: 100px;
        }

        h2 {
            color: #2b2b2b;
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            color: #4a4a4a;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: rgba(255, 255, 255, 0.4);
            color: #222;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        input[type="password"]::placeholder {
            color: #666;
        }

        input[type="password"]:focus {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        button {
            width: 100%;
            padding: 15px;
            background: rgba(241, 101, 35, 0.85);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(241, 101, 35, 0.3);
            margin-top: 5px;
        }

        button:hover {
            background: rgba(241, 101, 35, 1);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(241, 101, 35, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 22px;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.4;
            padding: 10px;
            border-radius: 8px;
            word-break: break-word;
        }

        .error { 
            color: #b71c1c; 
            background: rgba(255, 235, 238, 0.6);
            border: 1px solid rgba(239, 154, 154, 0.5);
        }
        
        .success { 
            color: #1b5e20; 
            background: rgba(232, 245, 233, 0.6);
            border: 1px solid rgba(165, 214, 167, 0.5);
        }
    </style>
</head>
<body>

<div class="glass-card">
    <h2>Restablecer Contraseña</h2>
    <p>Ingresá tu nueva clave para volver a jugar a <strong>Teca Saludable</strong></p>

    <input type="password" id="newPassword" placeholder="Nueva contraseña (mínimo 6 caracteres)">
    <input type="password" id="confirmPassword" placeholder="Confirmar contraseña">
    
    <button onclick="cambiarContrasena()">Cambiar Contraseña</button>

    <div id="statusMessage" class="message"></div>
</div>

<script>
    const PLAYFAB_TITLE_ID = "102CAA"; 

    // Obtener el token de la URL (soporta ?token= o ?Token=)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || urlParams.get('Token');

    const messageDiv = document.getElementById('statusMessage');

    if (!token) {
        messageDiv.className = "message error";
        messageDiv.innerText = "Atención: Para cambiar la contraseña debés ingresar desde el enlace que recibiste por correo electrónico.";
    }

    async function cambiarContrasena() {
        const pass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmPassword').value;

        if (!token) {
            messageDiv.className = "message error";
            messageDiv.innerText = "Error: Falta el token de autorización de correo.";
            return;
        }

        if (pass.length < 6) {
            messageDiv.className = "message error";
            messageDiv.innerText = "La contraseña debe tener al menos 6 caracteres.";
            return;
        }

        if (pass !== confirmPass) {
            messageDiv.className = "message error";
            messageDiv.innerText = "Las contraseñas no coinciden.";
            return;
        }

        messageDiv.className = "message";
        messageDiv.innerText = "Procesando solicitud...";

        try {
            const response = await fetch(`https://${PLAYFAB_TITLE_ID}.playfabapi.com/Client/ResetPassword`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    Token: token,
                    Password: pass
                })
            });

            const data = await response.json();

            if (data.code === 200 && data.status === "OK") {
                messageDiv.className = "message success";
                messageDiv.innerText = "¡Contraseña actualizada con éxito! Ya podés abrir la app e iniciar sesión.";
            } else {
                messageDiv.className = "message error";
                messageDiv.innerText = "Error de PlayFab: " + (data.errorMessage || "El enlace es inválido o ya fue utilizado.");
            }
        } catch (err) {
            messageDiv.className = "message error";
            messageDiv.innerText = "Error al conectar con PlayFab. Asegurate de abrir este enlace desde el mail recibido.";
        }
    }
</script>

</body>
</html>
