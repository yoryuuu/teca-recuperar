<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Teca Saludable</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            
            /* Imagen de fondo */
            background: url('fondo.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #f16523; 
        }

        .card {
            /* Blanco semitransparente para que se luzca la tarjeta y el fondo */
            background: rgba(255, 255, 255, 0.75);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 380px;
            width: 85%;
            text-align: center;
            backdrop-filter: blur(8px);
            
            /* Desplaza el cuadrado un poco más abajo */
            margin-top: 140px;
        }

        h2 {
            /* Letras del título cambiadas a blanco */
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2); /* Sombra suave para legibilidad */
        }

        p {
            color: #333333;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            transition: border-color 0.3s;
        }

        input[type="password"]:focus {
            border-color: #f16523;
        }

        /* Botón cambiado a tono naranja */
        button {
            width: 100%;
            padding: 14px;
            background-color: #f16523;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(241, 101, 35, 0.4);
        }

        button:hover {
            background-color: #d85213;
        }

        button:active {
            transform: scale(0.98);
        }

        .message {
            margin-top: 20px;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.4;
        }

        .error { color: #d32f2f; }
        .success { color: #2e7d32; }
    </style>
</head>
<body>

<div class="card">
    <h2>Restablecer Contraseña</h2>
    <p>Ingresá tu nueva clave para volver a jugar a <strong>Teca Saludable</strong></p>

    <input type="password" id="newPassword" placeholder="Nueva contraseña (mínimo 6 caracteres)">
    <input type="password" id="confirmPassword" placeholder="Confirmar contraseña">
    
    <button onclick="cambiarContrasena()">Cambiar Contraseña</button>

    <div id="statusMessage" class="message"></div>
</div>

<script>
    const PLAYFAB_TITLE_ID = "37D02"; 

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const messageDiv = document.getElementById('statusMessage');

    if (!token) {
        messageDiv.className = "message error";
        messageDiv.innerText = "Atención: El enlace no contiene un token válido o ha expirado.";
    }

    async function cambiarContrasena() {
        const pass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmPassword').value;

        if (!token) {
            messageDiv.className = "message error";
            messageDiv.innerText = "Enlace inválido o expirado.";
            return;
        }

        if (pass.length < 6) {
            messageDiv.className = "message error";
            messageDiv.innerText = "La contraseña debe tener al menos 6 caracteres.";
            return;
        }

        if (pass !== confirmPass) {
            messageDiv.className = "message error";
            messageDiv.innerText = "Las contraseñas no coinciden.";
            return;
        }

        messageDiv.className = "message";
        messageDiv.innerText = "Guardando cambios...";

        try {
            const response = await fetch(`https://${PLAYFAB_TITLE_ID}.playfabapi.com/Client/ResetPassword`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    Token: token,
                    Password: pass
                })
            });

            const data = await response.json();

            if (data.code === 200) {
                messageDiv.className = "message success";
                messageDiv.innerText = "¡Contraseña actualizada con éxito! Ya podés abrir la app e iniciar sesión.";
            } else {
                messageDiv.className = "message error";
                messageDiv.innerText = "Error: " + (data.errorMessage || "El token es inválido o ha expirado.");
            }
        } catch (err) {
            messageDiv.className = "message error";
            messageDiv.innerText = "Error de conexión con el servidor.";
        }
    }
</script>

</body>
</html>
